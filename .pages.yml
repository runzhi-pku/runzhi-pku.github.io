media:
  input: uploads
  output: /uploads
  rename: false
content:
- name: site
  label: 个人信息与网站设置
  type: file
  path: content/site.json
  format: json
  fields:
  - name: title
    label: 浏览器标题
    type: string
    required: true
  - name: description
    label: 搜索摘要
    type: text
  - name: brand
    label: 左上角标志文字
    type: string
  - name: headerLabel
    label: 右上角说明
    type: string
  - name: accent
    label: 主题色
    type: string
    pattern:
      regex: ^#[0-9A-Fa-f]{6}$
      message: '请输入 #1856d8 这样的六位颜色值。'
  - name: hero
    label: 个人简介
    type: object
    fields:
    - name: navLabel
      label: 导航名称
      type: string
    - name: eyebrow
      label: 顶部短句
      type: string
    - name: name
      label: 姓名或昵称
      type: string
      required: true
    - name: role
      label: 身份或职业
      type: string
    - name: greeting
      label: 欢迎语
      type: string
    - name: intro
      label: 详细介绍
      type: text
    - name: avatar
      label: 头像
      type: image
    - name: avatarAlt
      label: 头像说明
      type: string
    - name: linkLabel
      label: 简介下方链接文字
      type: string
    - name: link
      label: 简介下方链接地址
      type: string
  - name: contacts
    label: 联系方式与社交链接
    type: object
    fields:
    - name: label
      label: 显示名称
      type: string
      required: true
    - name: url
      label: 链接地址
      type: string
      description: 使用 https:// 开头的地址；邮箱使用 mailto:邮箱地址。
      required: true
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
  - name: footer
    label: 页脚文字
    type: object
    fields:
    - name: copyright
      label: 版权文字
      type: string
    - name: text
      label: 页脚短句
      type: string
    - name: topLabel
      label: 返回顶部文字
      type: string
    - name: adminLabel
      label: 管理入口文字
      type: string
  - name: labels
    label: 其他页面文字
    type: object
    fields:
    - name: skip
      label: 跳到正文文字
      type: string
    - name: navigation
      label: 导航说明
      type: string
    - name: download
      label: 下载按钮文字
      type: string
    - name: emptyFiles
      label: 暂无文件提示
      type: string
    - name: emptySection
      label: 空栏目提示
      type: string
    - name: details
      label: 默认详情链接文字
      type: string
- name: home
  label: 首页栏目（可增删与排序）
  type: file
  path: content/home.json
  format: json
  fields:
  - name: sections
    label: 栏目
    type: object
    fields:
    - name: id
      label: 栏目地址标识
      type: string
      required: true
      pattern:
        regex: ^[a-z][a-z0-9-]*$
        message: 使用小写字母、数字或短横线，且以字母开头。
      description: 各栏目不能重名，也不能使用 main、about。
    - name: navLabel
      label: 导航名称
      type: string
      description: 留空则不显示在顶部导航中。
    - name: kicker
      label: 编号或英文短句
      type: string
    - name: title
      label: 栏目标题
      type: string
      required: true
    - name: intro
      label: 栏目说明
      type: text
    - name: kind
      label: 展示方式
      type: select
      required: true
      options:
        values:
        - name: projects
          label: 项目列表
        - name: cards
          label: 图文卡片
        - name: text
          label: 纯文字
        - name: files
          label: 公开文件列表
    - name: visible
      label: 显示在主页
      type: boolean
      description: 关闭只会隐藏页面栏目，公开仓库中的内容依然可以被查看。
    - name: text
      label: 栏目正文
      type: text
    - name: items
      label: 栏目条目
      type: object
      fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: meta
        label: 分类或副标题
        type: string
      - name: text
        label: 正文
        type: text
      - name: tags
        label: 标签
        type: string
        list: true
      - name: image
        label: 图片
        type: image
      - name: imageAlt
        label: 图片说明
        type: string
      - name: link
        label: 相关链接
        type: string
      - name: linkLabel
        label: 链接文字
        type: string
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
- name: files
  label: 公开文件与下载
  type: file
  path: content/files.json
  format: json
  fields:
  - name: items
    label: 文件
    type: object
    fields:
    - name: title
      label: 文件显示名称
      type: string
      required: true
    - name: file
      label: 选择或上传文件
      type: file
      required: true
      description: 仅上传可以公开的文件。
    - name: description
      label: 文件介绍
      type: text
    - name: date
      label: 日期（可选）
      type: string
      description: 可填写 2026-09-05，也可留空。
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
